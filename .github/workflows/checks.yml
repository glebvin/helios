name: Проверки HELIOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helios-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-checks:
    name: Документы, типы и сборка
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.HELIOS_CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Corepack
        run: npm install --global corepack@0.35.0
      - name: Зависимости по lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Ссылки и карточки roadmap
        run: python3 scripts/check-docs.py
      - name: TypeScript
        run: node scripts/check-types.mjs
      - name: Production frontend
        run: corepack pnpm --filter @helios/web build
      - name: Frontend behavior
        run: node --experimental-strip-types --test apps/web/src/*.test.ts
      - name: Domain
        run: corepack pnpm --filter @helios/domain test

  server-tests:
    name: API и изоляция данных
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.HELIOS_CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    services:
      postgres:
        image: ${{ vars.HELIOS_CI_MODE != 'server' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios
          POSTGRES_DB: helios
          PGPORT: '54339'
          PGDATA: /var/lib/postgresql/data/codex-api/.data/pg-54339
        ports:
          - 54339:54339
        options: >-
          --health-cmd "pg_isready -U helios -d helios -p 54339"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_DATABASE_URL: postgres://helios:helios@127.0.0.1:54339/helios
      DATABASE_URL: postgres://helios_app:helios_app@127.0.0.1:54339/helios
      HELIOS_DB_PORT: '54339'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Corepack
        run: npm install --global corepack@0.35.0
      - name: Зависимости по lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Только новая одноразовая CI база
        run: node .github/scripts/prepare-ci-db.mjs
      - name: Миграции
        run: corepack pnpm --filter @helios/api migrate
      - name: Синтетическая тестовая фикстура
        run: corepack pnpm --filter @helios/api seed
      - name: API regression последовательно
        run: corepack pnpm --filter @helios/api test
      - name: Собранный runtime API/worker
        run: |
          python3 deploy/helios-staging/build.py
          npm ci --prefix .data/staging-runtime --omit=dev --ignore-scripts --no-audit --no-fund
          node deploy/helios-staging/check-runtime.mjs
      - name: Отказы и восстановление readiness на отдельном TCP proxy
        env:
          HELIOS_READY_QA_PROFILE: ci
        run: node qa/ready-integration.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: readiness-${{ github.sha }}
          path: |
            .data/ci-ready/results.json
            .data/ci-ready/*.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  browser-smoke:
    name: Браузерный smoke текущего UI
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.HELIOS_CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: codex-api
    services:
      postgres:
        image: ${{ vars.HELIOS_CI_MODE != 'server' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios
          POSTGRES_DB: helios
          PGPORT: '54339'
          PGDATA: ${{ github.workspace }}/codex-api/.data/pg-54339
        ports:
          - 54339:54339
        options: >-
          --health-cmd "pg_isready -U helios -d helios -p 54339"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_DATABASE_URL: postgres://helios:helios@127.0.0.1:54339/helios
      DATABASE_URL: postgres://helios_app:helios_app@127.0.0.1:54339/helios
      HELIOS_DB_PORT: '54339'
      HELIOS_CI_FIXTURE: disposable
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: codex-api
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global corepack@0.35.0
      - run: corepack pnpm install --frozen-lockfile
      - name: Основное зеркало Ubuntu для зависимостей браузеров
        if: vars.HELIOS_CI_MODE != 'server'
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          mirrors = Path('/etc/apt/apt-mirrors.txt')
          if mirrors.is_file():
              mirrors.write_text('https://archive.ubuntu.com/ubuntu/\n')
          PYTHON
      - env:
          HELIOS_CI_MODE: ${{ vars.HELIOS_CI_MODE }}
        run: |
          if [ "$HELIOS_CI_MODE" = server ]; then
            corepack pnpm exec playwright install chromium
          else
            corepack pnpm exec playwright install --with-deps chromium
          fi
      - run: node .github/scripts/prepare-ci-db.mjs
      - run: corepack pnpm --filter @helios/api migrate
      - run: corepack pnpm --filter @helios/api seed
      - run: corepack pnpm --filter @helios/web build
      - name: Реальный UI → NestJS → PostgreSQL
        run: node --experimental-strip-types qa/ci-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-smoke-${{ github.sha }}
          path: |
            codex-api/.data/ci-browser/results.json
            codex-api/.data/ci-browser/*.png
            codex-api/.data/ci-browser/*.log
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn

  offline-checks:
    name: Offline — Chromium и WebKit, очередь и реальный API
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.HELIOS_CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: codex-api
    services:
      postgres:
        image: ${{ vars.HELIOS_CI_MODE != 'server' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios
          POSTGRES_DB: helios
          PGPORT: '54339'
          PGDATA: ${{ github.workspace }}/codex-api/.data/pg-54339
        ports:
          - 54339:54339
        options: >-
          --health-cmd "pg_isready -U helios -d helios -p 54339"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_DATABASE_URL: postgres://helios:helios@127.0.0.1:54339/helios
      DATABASE_URL: postgres://helios_app:helios_app@127.0.0.1:54339/helios
      HELIOS_DB_PORT: '54339'
      API_PORT: '4327'
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: codex-api
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global corepack@0.35.0
      - run: corepack pnpm install --frozen-lockfile
      - name: Основное зеркало Ubuntu для зависимостей браузеров
        if: vars.HELIOS_CI_MODE != 'server'
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          mirrors = Path('/etc/apt/apt-mirrors.txt')
          if mirrors.is_file():
              mirrors.write_text('https://archive.ubuntu.com/ubuntu/\n')
          PYTHON
      - env:
          HELIOS_CI_MODE: ${{ vars.HELIOS_CI_MODE }}
        run: |
          if [ "$HELIOS_CI_MODE" = server ]; then
            corepack pnpm exec playwright install chromium webkit
          else
            corepack pnpm exec playwright install --with-deps chromium webkit
          fi
      - run: node .github/scripts/prepare-ci-db.mjs
      - run: corepack pnpm --filter @helios/api migrate
      - name: Полный набор очереди Chromium/WebKit, последовательно
        shell: bash
        run: |
          mkdir -p .data/ci-offline
          export HELIOS_PLAYWRIGHT_MODULE="$(node --input-type=module -e "import {createRequire} from 'node:module'; import {dirname,join} from 'node:path'; console.log(join(dirname(createRequire(import.meta.url).resolve('playwright')),'index.mjs'))")"
          node packages/offline/test/browser.test.mjs all 2>&1 | tee .data/ci-offline/results.tap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-${{ github.sha }}
          path: codex-api/.data/ci-offline/results.tap
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn

  backup-restore:
    name: Резерв и восстановление
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.HELIOS_CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Защита временных файлов и назначения восстановления
        run: python3 qa/r46-safety.test.py
      - name: Учебные контуры 54502/54512 и настоящий pg_restore
        run: python3 qa/r46-restore.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backup-restore-${{ github.sha }}
          path: .data/r46/result.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  s3-evidence:
    name: Учебное S3-хранилище
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.HELIOS_CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Corepack
        run: npm install --global corepack@0.35.0
      - name: Зависимости по lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Файловый адаптер и учебный SeaweedFS
        run: corepack pnpm --filter @helios/api exec tsx --test ../../qa/r49-s3.test.ts
