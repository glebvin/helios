name: Небольшая задача
description: Один проверяемый пользовательский результат
title: "Задача: "
body:
  - type: input
    id: step
    attributes:
      label: Шаг roadmap и роль
  - type: textarea
    id: source
    attributes:
      label: Связь с ТЗ и обязательный остаток
      description: ТЗ v1.0: раздел/T-сценарий и решения D по применимости; какая часть реализуется и что остаётся в связанных issues. Старую4.0 помечать как историческую.
      placeholder: "ТЗ v1.0 §11.2, T-02: сроки квалификаций. Полный маршрут допуска остаётся R06/R29/R32."
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Что должно заработать
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Готово, когда
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Границы и зависимости
