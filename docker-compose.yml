services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios
      POSTGRES_DB: helios
    ports:
      - "54329:5432"
    volumes:
      - helios_pg:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/00-role.sql
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: helios
      MINIO_ROOT_PASSWORD: helios-secret
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - helios_files:/data
volumes:
  helios_pg:
  helios_files:
